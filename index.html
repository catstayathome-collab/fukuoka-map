<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>福岡行程地圖</title>
  <meta name="description" content="福岡行程地圖：Day 切換、列表同步、編號 marker、路線連線、底部抽屜與手機版介面。" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="device-shell">
    <main class="app">
      <section class="map-stage">
        <div id="map" aria-label="福岡行程地圖"></div>
        <div class="map-shade"></div>

        <header class="hero-overlay">
          <div class="hero-topline hero-topline-stack">
            <nav class="hero-day-tabs-wrap" aria-label="行程天數切換">
              <div id="day-tabs" class="day-tabs day-tabs-top"></div>
            </nav>
          </div>

          <div class="hero-copy">
            <p id="hero-date" class="hero-date"></p>
            <h1 id="hero-title">福岡行程地圖</h1>
            <p id="hero-summary" class="hero-summary" hidden></p>
          </div>
        </header>

        <div class="floating-actions">
          <button id="fit-day-btn" class="floating-btn" type="button">顯示當天全部</button>
          <a id="selected-maps-btn" class="floating-btn secondary is-disabled" href="#" target="_blank" rel="noreferrer noopener">Google Maps</a>
        </div>

        <div id="map-empty-state" class="map-empty-state is-hidden"></div>
      </section>

      <section id="bottom-sheet" class="bottom-sheet" aria-label="當日行程抽屜">
        <div id="sheet-handle-area" class="sheet-handle-area" aria-hidden="true">
          <span class="sheet-handle"></span>
        </div>

        <div class="sheet-content">
          <section class="list-section list-section-minimal">
            <div class="section-head section-head-minimal">
              <div>
                <h2 id="current-day-title">Day 1 行程</h2>
                <p id="current-day-meta" class="section-subtitle" hidden></p>
              </div>
              <span id="day-count-badge" class="count-pill" hidden>0 筆</span>
            </div>

            <div id="itinerary-list" class="itinerary-list"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <template id="itinerary-card-template">
    <article class="itinerary-card" role="button" tabindex="0">
      <div class="card-order"></div>
      <div class="card-body">
        <div class="card-line">
          <span class="card-time"></span>
          <span class="card-category"></span>
          <span class="card-map-state"></span>
        </div>
        <h3 class="card-title"></h3>
        <p class="card-address"></p>
        <p class="card-note"></p>
        <div class="card-actions">
          <button type="button" class="mini-action focus-btn">定位</button>
          <a class="mini-action maps-btn" target="_blank" rel="noreferrer noopener">Google Maps</a>
        </div>
      </div>
    </article>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./data/itinerary-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
